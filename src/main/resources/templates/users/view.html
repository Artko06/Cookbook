<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout :: head(${author.username})}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Рецепты автора <span th:text="${author.username}">author</span></h1>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="item : ${recipes}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a class="text-decoration-none" th:href="@{/recipes/{id}(id=${item.id})}"
                           th:text="${item.title}">title</a>
                    </h5>
                    <div class="mt-auto text-muted small">
                        <span th:if="${item.cookingTimeMin != null}" th:text="|${item.cookingTimeMin} мин · |"></span>
                        <span th:text="|${item.servings} порц.|"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(recipes)}">
            <p class="text-muted">У этого автора пока нет рецептов.</p>
        </div>
    </div>

    <nav class="mt-4" th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users/{username}(username=${author.username}, size=${size}, page=${page.number - 1})}">Назад</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|Стр. ${page.number + 1} из ${page.totalPages}|">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users/{username}(username=${author.username}, size=${size}, page=${page.number + 1})}">Вперёд</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
