<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout :: head('Рецепт')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container" style="max-width: 860px;">
    <h1 class="mb-4" th:text="${recipeId != null} ? 'Редактирование рецепта' : 'Новый рецепт'">Рецепт</h1>

    <form th:object="${recipeForm}" method="post" th:action="@{${formAction}}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"
             th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

        <div class="mb-3">
            <label class="form-label" for="title">Название</label>
            <input class="form-control" type="text" id="title" th:field="*{title}">
            <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Описание</label>
            <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label" for="instructions">Инструкция</label>
            <textarea class="form-control" id="instructions" rows="6" th:field="*{instructions}"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="servings">Порций</label>
                <input class="form-control" type="number" id="servings" min="1" th:field="*{servings}">
                <div class="text-danger small" th:if="${#fields.hasErrors('servings')}" th:errors="*{servings}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="cookingTimeMin">Время готовки, мин</label>
                <input class="form-control" type="number" id="cookingTimeMin" min="1" th:field="*{cookingTimeMin}">
                <div class="text-danger small" th:if="${#fields.hasErrors('cookingTimeMin')}" th:errors="*{cookingTimeMin}"></div>
            </div>
        </div>

        <h4 class="mt-3">Состав</h4>
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Ингредиент</th>
                <th style="width: 130px;">Количество</th>
                <th style="width: 110px;">Ед.</th>
                <th>Примечание</th>
                <th style="width: 44px;"></th>
            </tr>
            </thead>
            <tbody id="ingredients-rows">
            <tr th:each="line, stat : *{ingredients}">
                <td>
                    <select class="form-select" th:field="*{ingredients[__${stat.index}__].ingredientId}">
                        <option value="">— выберите —</option>
                        <option th:each="ing : ${allIngredients}" th:value="${ing.id}" th:text="${ing.name}"></option>
                    </select>
                </td>
                <td>
                    <input class="form-control" type="number" step="0.01" min="0.01"
                           th:field="*{ingredients[__${stat.index}__].quantity}">
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('ingredients[' + stat.index + '].quantity')}"
                         th:errors="*{ingredients[__${stat.index}__].quantity}"></div>
                </td>
                <td><input class="form-control" th:field="*{ingredients[__${stat.index}__].unit}"></td>
                <td><input class="form-control" th:field="*{ingredients[__${stat.index}__].note}"></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger remove-row">&times;</button></td>
            </tr>
            </tbody>
        </table>

        <button type="button" class="btn btn-outline-secondary mb-4" id="add-ingredient">+ добавить ингредиент</button>

        <template id="ingredient-row">
            <tr>
                <td>
                    <select class="form-select" name="ingredients[__INDEX__].ingredientId">
                        <option value="">— выберите —</option>
                        <option th:each="ing : ${allIngredients}" th:value="${ing.id}" th:text="${ing.name}"></option>
                    </select>
                </td>
                <td><input class="form-control" type="number" step="0.01" min="0.01"
                           name="ingredients[__INDEX__].quantity"></td>
                <td><input class="form-control" name="ingredients[__INDEX__].unit"></td>
                <td><input class="form-control" name="ingredients[__INDEX__].note"></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger remove-row">&times;</button></td>
            </tr>
        </template>

        <div>
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a class="btn btn-link" th:href="@{/recipes}">Отмена</a>
        </div>
    </form>
</div>

<script th:src="@{/js/recipe-form.js}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
