<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'Кулинарная книга'">Кулинарная книга</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Кулинарная книга</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/recipes}">Рецепты</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ingredients}">Ингредиенты</a></li>
            </ul>
            <ul class="navbar-nav" th:if="${currentUser != null}">
                <li class="nav-item"><a class="nav-link" th:href="@{/recipes/my}">Мои рецепты</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/recipes/new}">Новый рецепт</a></li>
                <li class="nav-item"><span class="navbar-text me-3" th:text="${currentUser}">user</span></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link d-inline p-0">Выйти</button>
                    </form>
                </li>
            </ul>
            <ul class="navbar-nav" th:if="${currentUser == null}">
                <li class="nav-item"><a class="nav-link" th:href="@{/login}">Войти</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/register}">Регистрация</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="footer" class="mt-5">
    <footer class="text-center text-muted py-4 border-top">
        <div class="container">Кулинарная книга — учебный проект</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
