<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout :: head('Рецепты')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Рецепты</h1>
        <a class="btn btn-primary" th:if="${currentUser != null}" th:href="@{/recipes/new}">Новый рецепт</a>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="item : ${recipes}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a class="text-decoration-none" th:href="@{/recipes/{id}(id=${item.id})}"
                           th:text="${item.title}">title</a>
                    </h5>
                    <p class="card-text text-muted mb-2">
                        Автор:
                        <a th:href="@{/users/{username}(username=${item.authorUsername})}"
                           th:text="${item.authorUsername}">author</a>
                    </p>
                    <div class="mt-auto text-muted small">
                        <span th:if="${item.cookingTimeMin != null}" th:text="|${item.cookingTimeMin} мин · |"></span>
                        <span th:text="|${item.servings} порц.|"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(recipes)}">
            <p class="text-muted">Рецептов пока нет.</p>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
</body>
</html>
