spring:
  application:
    name: cookbook
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookbook}
    username: ${DB_USER:cookbook}
    password: ${DB_PASSWORD:cookbook}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
