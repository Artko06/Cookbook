spring:
  application:
    name: cookbook
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookbook}
    username: ${DB_USER:cookbook}
    password: ${DB_PASSWORD:cookbook}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
  thymeleaf:
    cache: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: cookbook

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

cookbook:
  demo:
    chaos-enabled: ${DEMO_CHAOS_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.example.cookbook: DEBUG
  structured:
    format:
      console: logstash
    json:
      add:
        service.name: cookbook
      rename:
        "[@timestamp]": timestamp
