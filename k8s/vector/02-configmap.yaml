apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: cookbook
data:
  vector.yaml: |
    data_dir: /vector-data
    sources:
      k8s:
        type: kubernetes_logs
    transforms:
      parse_json:
        type: remap
        inputs: [k8s]
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge!(., parsed)
          }
      only_app:
        type: filter
        inputs: [parse_json]
        condition: '.kubernetes.pod_namespace == "cookbook" && .kubernetes.container_name == "app"'
    sinks:
      vlogs:
        type: elasticsearch
        inputs: [only_app]
        endpoints: ["http://victoria-logs:9428/insert/elasticsearch/"]
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,kubernetes.container_name
