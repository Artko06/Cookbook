apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: cookbook
  labels:
    app: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/prober.py
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: PROBE_URL
              value: "http://app:8080/api/v1/recipes?size=5"
            - name: PROBE_INTERVAL_SECONDS
              value: "15"
            - name: PROBE_TIMEOUT_SECONDS
              value: "5"
            - name: PROBE_PORT
              value: "9090"
            - name: LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: prober-script
