server:
  datasource:
    url: http://vm-single-victoria-metrics-single-server.monitoring.svc:8428
  configMap: vmalert-rules

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by:
        - alertname
        - severity
        - service
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id_file: /etc/alertmanager/secrets/chat-id
            send_resolved: true
            message: |
              [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}{{ end }}
  extraVolumes:
    - name: telegram-secrets
      secret:
        secretName: alertmanager-telegram
  extraVolumeMounts:
    - name: telegram-secrets
      mountPath: /etc/alertmanager/secrets
      readOnly: true
