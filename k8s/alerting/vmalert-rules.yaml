apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: monitoring
data:
  alert-rules.yaml: |
    groups:
      - name: cookbook-service
        interval: 30s
        rules:
          - alert: CookbookAppDown
            expr: |
              max(up{job="kubernetes-pods",namespace="cookbook",app="app"}) == 0
              or
              absent(max(up{job="kubernetes-pods",namespace="cookbook",app="app"}))
            for: 2m
            labels:
              severity: critical
              service: cookbook
            annotations:
              summary: "Приложение Cookbook недоступно"
              description: "Нет успешного scrape метрик приложения более 2 минут"

          - alert: CookbookProbeFailures
            expr: |
              sum(rate(cookbook_probe_runs_total{result="failure"}[5m]))
              /
              sum(rate(cookbook_probe_runs_total[5m]))
              > 0.20
            for: 5m
            labels:
              severity: warning
              service: cookbook
            annotations:
              summary: "Пробер Cookbook фиксирует ошибки"
              description: "Доля неуспешных проверок пользовательского сценария выше 20% за 5 минут"

          - alert: CookbookDbDown
            expr: |
              max(pg_up{job="kubernetes-pods",namespace="cookbook",app="db"}) == 0
              or
              absent(max(pg_up{job="kubernetes-pods",namespace="cookbook",app="db"}))
            for: 2m
            labels:
              severity: critical
              service: cookbook
            annotations:
              summary: "PostgreSQL Cookbook недоступен"
              description: "postgres-exporter не видит БД более 2 минут"

      - name: cookbook-framework
        interval: 30s
        rules:
          - alert: CookbookHigh5xxRate
            expr: |
              sum(rate(http_server_requests_seconds_count{
                application="cookbook",
                status=~"5..",
                uri!~"/actuator.*"
              }[5m]))
              /
              sum(rate(http_server_requests_seconds_count{
                application="cookbook",
                uri!~"/actuator.*"
              }[5m]))
              > 0.10
            for: 5m
            labels:
              severity: critical
              service: cookbook
            annotations:
              summary: "Высокая доля 5xx в Cookbook"
              description: "Доля ответов 5xx среди пользовательских запросов выше 10% за 5 минут"
