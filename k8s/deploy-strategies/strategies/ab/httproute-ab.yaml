# A/B TESTING.
# В отличие от canary (дробление по весу — случайная выборка), A/B направляет
# на новую версию ТОЧНО выбранную аудиторию — здесь по HTTP-заголовку.
# Правило 1: если есть заголовок `x-user-group: beta` -> вся такая публика на v2.
# Правило 2 (по умолчанию): все остальные -> v1.
#
# Проверка:
#   curl -sI http://localhost:8888/api/v1/recipes                          -> v1.0.0
#   curl -sI -H 'x-user-group: beta' http://localhost:8888/api/v1/recipes  -> v2.0.0
#
# Помимо заголовков Gateway API умеет матчить query-параметры и метод — удобно
# для таргетинга по гео, типу клиента и т.п.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: cookbook-v2
          port: 80
    - backendRefs:
        - name: cookbook-v1
          port: 80
