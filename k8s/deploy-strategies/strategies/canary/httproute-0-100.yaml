# CANARY — шаг 3 (финал): 100% на v2.0.0. После этого старую v1 можно масштабировать
# в 0 или удалить. Откат на любом шаге — вернуть веса назад (90/10 или 100/0).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: cookbook-v1
          port: 80
          weight: 0
        - name: cookbook-v2
          port: 80
          weight: 100
