# CANARY — шаг 2: 50/50. Применяем, когда метрики v2 на 10% выглядят здоровыми.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: cookbook-v1
          port: 80
          weight: 50
        - name: cookbook-v2
          port: 80
          weight: 50
