# CANARY — шаг 1: 90% трафика на стабильную v1.0.0, 10% на новую v2.0.0.
# В Gateway API дробление делается весами (weight) в backendRefs одного HTTPRoute.
# Дальше постепенно увеличиваем долю v2: 50/50 -> 0/100 (см. соседние файлы).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: cookbook-v1
          port: 80
          weight: 90
        - name: cookbook-v2
          port: 80
          weight: 10
