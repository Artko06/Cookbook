# ROLLING UPDATE — шаг 2: накатываем версию 2.
# Меняем ТОЛЬКО поле APP_VERSION у того же Deployment `cookbook` и применяем файл.
# Kubernetes запускает rolling update: поднимает новый под (maxSurge=1), ждёт его
# Ready, гасит один старый — и так, пока все 6 подов не станут v2.0.0.
# Сервис и HTTPRoute не трогаем — трафик как шёл на `cookbook`, так и идёт.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook
  namespace: cookbook-deploy
  labels:
    app: cookbook
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cookbook
  template:
    metadata:
      labels:
        app: cookbook
        version: v2.0.0   # новая версия — во время раскатки старые поды (v1.0.0)
                          # и новые (v2.0.0) различимы по метке и в метриках
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: app
          image: cookbook-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: APP_VERSION
              value: v2.0.0
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
