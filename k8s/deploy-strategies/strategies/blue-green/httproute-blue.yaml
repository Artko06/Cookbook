# BLUE/GREEN — мгновенное переключение всего трафика на «синюю» (новую) версию v2.0.0.
# Применяем поверх httproute-green.yaml: HTTPRoute тот же (`cookbook`), меняется
# только backendRef. Откат — так же мгновенно: снова применить green.
# Старая версия v1 остаётся поднятой ещё какое-то время — на случай отката.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: cookbook-v2   # blue
          port: 80
