# BLUE/GREEN — весь трафик на «зелёную» (старую) версию v1.0.0.
# Обе версии (cookbook-v1 и cookbook-v2) задеплоены и готовы, но пользователи на v1.
# Переключение на blue — применить httproute-blue.yaml (тот же HTTPRoute `cookbook`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cookbook
  namespace: cookbook-deploy
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: cookbook-v1   # green
          port: 80
