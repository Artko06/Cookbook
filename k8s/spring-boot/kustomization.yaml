apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cookbook

resources:
  - 00-namespace.yaml
  - 01-db-pvc.yaml
  - 02-db-deployment.yaml
  - 03-db-service.yaml
  - 04-app-configmap.yaml
  - 05-app-deployment.yaml
  - 06-app-service.yaml

secretGenerator:
  - name: db-secret
    envs:
      - db-secret.env
    options:
      disableNameSuffixHash: true
