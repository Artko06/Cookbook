apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cookbook
data:
  vl.yml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs:9428
        isDefault: true
        jsonData:
          maxLines: 1000
