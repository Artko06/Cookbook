services:
  db:
    image: postgres:16-alpine
    container_name: cookbook-db
    environment:
      POSTGRES_DB: ${DB_NAME:-cookbook}
      POSTGRES_USER: ${DB_USER:-cookbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cookbook}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cookbook} -d ${DB_NAME:-cookbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cookbook-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-cookbook}
      DB_USER: ${DB_USER:-cookbook}
      DB_PASSWORD: ${DB_PASSWORD:-cookbook}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
